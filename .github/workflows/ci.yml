# Build + logic harness on a real Mac for every push and pull request.
# Mirrors what a contributor runs locally: `swift build` (not Xcode, see
# CLAUDE.md), the --profile-test harness, the offscreen snapshot renders, and
# the .app assembly (ad-hoc signed; no secrets are used or needed).
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Lint localizations
        run: |
          for f in Localization/*.lproj/Localizable.strings; do plutil -lint "$f"; done
          # Every English key must have a zh-Hans translation.
          keys() { plutil -convert json -o - "$1" | python3 -c 'import json,sys; print("\n".join(sorted(json.load(sys.stdin))))'; }
          diff <(keys Localization/en.lproj/Localizable.strings) <(keys Localization/zh-Hans.lproj/Localizable.strings)

      - name: Build (debug)
        run: swift build -c debug --force-resolved-versions

      - name: Backup / restore scripts
        run: scripts/test_backup.sh

      # A fresh runner has none of Apple's on-demand NaturalLanguage assets;
      # a user's Mac fetches them the first time a language is used. The
      # embedding checks need the Latin-script model, so fetch it the same way.
      - name: Fetch NaturalLanguage embedding assets
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cat > /tmp/nlassets.swift <<'SWIFT'
          import Foundation
          import NaturalLanguage
          let done = DispatchSemaphore(value: 0)
          for lang in [NLLanguage.english, .turkish] {
              guard let model = NLContextualEmbedding(language: lang) else { continue }
              if model.hasAvailableAssets { print("\(lang.rawValue): already present"); continue }
              model.requestAssets { result, error in
                  print("\(lang.rawValue): \(result.rawValue) \(error?.localizedDescription ?? "")")
                  done.signal()
              }
              _ = done.wait(timeout: .now() + 120)
          }
          SWIFT
          swift /tmp/nlassets.swift

      - name: Logic harness (--profile-test)
        run: |
          set +e
          .build/debug/Parrot --profile-test > harness.log 2>&1
          status=$?
          echo "--- failing checks ---"
          grep -E "^FAIL " harness.log || echo "(none)"
          echo "passed: $(grep -c '^PASS ' harness.log)  failed: $(grep -c '^FAIL ' harness.log)"
          tail -1 harness.log
          exit $status

      - name: Snapshot renders
        run: |
          # Assemble a real .app (debug) so Bundle.main finds Localization/*.lproj;
          # the bare .build/debug executable has no resources and would render English only.
          make bundle CONFIG=debug SIGN_IDENTITY=-
          BIN="$PWD/dist/Parrot.app/Contents/MacOS/Parrot"
          # The app is sandboxed, so its writes land in its container; collect them after each run.
          C="$HOME/Library/Containers/io.github.cknb6.ckparrot/Data"
          grab() { mkdir -p "$1"; find "$C" -name '*.png' -newer /tmp/mark -exec mv {} "$1"/ \; ; }
          for L in zh-Hans en; do
            touch /tmp/mark; sleep 1
            "$BIN" --snapshot "snapshots/$L/report.png" -AppleLanguages "($L)"
            "$BIN" --copilot-snapshot "snapshots/$L/copilot.png" -AppleLanguages "($L)"
            "$BIN" --sidebar-snapshot "snapshots/$L/sidebar.png" -AppleLanguages "($L)"
            grab "snapshots/$L"
          done
          touch /tmp/mark; sleep 1
          "$BIN" --help-shots snapshots/help -AppleLanguages "(en)"; grab snapshots/help
          touch /tmp/mark; sleep 1
          "$BIN" --help-shots snapshots/help-zh -AppleLanguages "(zh-Hans)"; grab snapshots/help-zh
          find snapshots -name '*.png' | sort

      # Small JPEG previews in the log, for reviewers who can't open artifacts.
      - name: Preview renders (base64 JPEG)
        if: always()
        run: |
          for f in snapshots/help-zh/settings-connections.png snapshots/help-zh/ask.png; do
            [ -f "$f" ] || continue
            sips -Z 460 -s format jpeg -s formatOptions 30 "$f" --out /tmp/preview.jpg >/dev/null
            echo "=== PREVIEW $f ==="
            base64 -i /tmp/preview.jpg | tr -d '\n'; echo
            echo "=== END ==="
          done

      - name: Assemble app bundle (ad-hoc)
        run: make bundle CONFIG=debug SIGN_IDENTITY=-

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            snapshots/
            harness.log
          if-no-files-found: ignore
