# ck-parrot: tag vX.Y.Z → unsigned (ad-hoc) CK Parrot.app as ck-parrot_*.zip/.dmg
name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传到的发布标签（如 v1.0.0），留空则只构建产物"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || 'latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if a v* tag points at this commit (tag run builds it)
        if: ${{ env.TAG == 'latest' && github.event_name == 'push' }}
        run: |
          if git ls-remote --tags origin 'v*' | grep -q "^${GITHUB_SHA}"; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "tag run will build this commit"; fi
      - name: Toolchain
        if: env.SKIP != '1'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build app (release, ad-hoc)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          V="$(echo "$TAG" | sed -n 's/^v//p')"; V="${V:-2.1.1}"
          make bundle CONFIG=release SIGN_IDENTITY=- VERSION="$V"
          test -f dist/Parrot.app/Contents/Resources/zh-Hans.lproj/Localizable.strings
          mv dist/Parrot.app "dist/CK Parrot.app"
          ditto -c -k --keepParent "dist/CK Parrot.app" "ck-parrot_${V}_macOS_arm64.zip"
          STAGE="$(mktemp -d)"; cp -R "dist/CK Parrot.app" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall.command "$STAGE/卸载 CK Parrot.command"
          hdiutil create -volname "CK Parrot" -srcfolder "$STAGE" -ov -format UDZO "ck-parrot_${V}_macOS_arm64.dmg"
          pkgbuild --component "dist/CK Parrot.app" --identifier io.github.cknb6.ckparrot --version "$V" --install-location /Applications "ck-parrot_${V}_macOS_arm64.pkg"
          ls -la ck-parrot_*
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: ck-parrot-macos
          path: ck-parrot_*
      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TAG" = latest ]; then
            gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
            SHORT="${GITHUB_SHA::7}"
            printf '%s\n' "自动构建，对应提交 \`${SHORT}\`（${GITHUB_SHA}），可能不稳定；正式版请看带 v 的版本。" "" \
              "安装：打开 .dmg 拖入“应用程序”，或双击 .pkg 安装。未经 Apple 公证，首次打开请右键 → 打开，或执行 \`xattr -cr \"/Applications/CK Parrot.app\"\`。仅支持 macOS 14+ Apple 芯片。" > notes.md
            gh release create latest ck-parrot_*_macOS_arm64.* --target "${GITHUB_SHA}" --prerelease \
              --title "最新构建（${SHORT}）" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ck-parrot_*_macOS_arm64.* --clobber --repo "$GITHUB_REPOSITORY"; exit 0
          fi
          gh release create "$TAG" ck-parrot_*_macOS_arm64.zip ck-parrot_*_macOS_arm64.dmg ck-parrot_*_macOS_arm64.pkg \
            --repo "$GITHUB_REPOSITORY" --title "CK Parrot $TAG" \
            --notes-file RELEASE_NOTES.zh-CN.md

      # ck-parrot v2.1.1: Sparkle appcast for in-app updates (tag runs only).
      # The zip is EdDSA-signed with the SPARKLE_ED_PRIVATE_KEY secret; the app
      # carries the matching SUPublicEDKey and rejects anything else. The feed
      # lives on a fixed "appcast" release so its URL never changes.
      - name: Publish Sparkle appcast
        if: ${{ env.SKIP != '1' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_KEY" ] || { echo "SPARKLE_ED_PRIVATE_KEY missing"; exit 1; }
          V="${TAG#v}"; ZIP="ck-parrot_${V}_macOS_arm64.zip"
          # sign_update ships in Sparkle's release tarball, not in the SwiftPM artifact.
          SV="$(python3 -c 'import json;print([p["state"]["version"] for p in json.load(open("Package.resolved"))["pins"] if p["identity"]=="sparkle"][0])')"
          mkdir -p /tmp/sparkle && curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SV}/Sparkle-${SV}.tar.xz" | tar -xJ -C /tmp/sparkle
          SIGN=/tmp/sparkle/bin/sign_update
          [ -x "$SIGN" ] || { echo "sign_update not found"; exit 1; }
          KF="$(mktemp)"; printf %s "$SPARKLE_KEY" > "$KF"
          ATTRS="$("$SIGN" --ed-key-file "$KF" "$ZIP")"; rm -f "$KF"
          echo "$ATTRS" | grep -q 'sparkle:edSignature=' || { echo "signing failed"; exit 1; }
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "dist/CK Parrot.app/Contents/Info.plist")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>CK Parrot</title>
              <item>
                <title>CK Parrot ${V}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${V}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}</sparkle:releaseNotesLink>
                <enclosure url="${URL}" ${ATTRS} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout appcast.xml
          gh release upload "$TAG" appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
          if gh release view appcast --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload appcast appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create appcast appcast.xml --target "${GITHUB_SHA}" --prerelease --title "更新源（自动维护）" \
              --notes "CK Parrot 应用内更新使用的 appcast，请勿删除。" --repo "$GITHUB_REPOSITORY"
          fi
          cat appcast.xml
